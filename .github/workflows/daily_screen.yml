name: Daily Shariah Screening Watchdog

on:
  schedule:
    # Runs daily at 18:30 UTC (00:00 IST / Midnight)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Watchdog & Re-Screen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_watchdog.py
      - name: Sync to Firebase Cloud
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    run: |
      python -m screener.firebase_publisher

      - name: Commit and Push if Results Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_results.json
          
          if git diff --staged --quiet; then
            echo "No changes in financial results. Skipping commit."
          else
            git commit -m "chore(data): auto-update Shariah screening results [skip ci]"
            git push
          fi